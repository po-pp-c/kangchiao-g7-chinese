kground:#e3e8eb;border-radius:20px;margin:12px 0 20px;overflow:hidden}.progress>div{height:100%;background:#287b62}.footer{margin:18px 0;color:#697783;font-size:13px;line-height:1.7}button{cursor:pointer}button:disabled{opacity:.45}@media(min-width:700px){canvas{height:320px}}</style></head><body><div class="wrap"><div class="top"><div><h1>康橋 G7｜國文第六課</h1><div class="muted">那默默的一群 · Apple Pencil 手寫練習</div></div><button onclick="resetAll()" style="background:none;border:0;color:#6a7b85">重設紀錄</button></div><div class="tabs" id="tabs"><span>國字注音　｜　形近字　｜　字義解釋</span></div><div class="panel"><div class="meta"><span id="category">國字注音</span><span id="count">1 / 28</span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question">「ㄆㄨˊ」實</div><div class="hint" id="hint">請在下方直接手寫答案</div><div class="canvasbox"><canvas id="pad"></canvas></div><div class="actions"><button onclick="undo()">↶ 撤銷一筆</button><button onclick="clearPad()">清除筆跡</button><button class="primary" onclick="reveal()">查看正確答案</button></div><div id="answer" hidden></div><div id="score" class="score" hidden><button onclick="grade(false)">需要再練一次</button><button class="ok" onclick="grade(true)">我寫對了 ✓</button></div><div class="actions"><button onclick="prev()">上一題</button><button onclick="next()">下一題 →</button></div></div><div class="footer" id="stats">若無法切換題目，請將檔案下載後用 Safari 開啟；聊天內建預覽可能不執行互動功能。</div><div class="footer">資料依據：第六課講義第 42–44 頁。題目無選項，請自行默寫。手寫答案由孩子自行對照，系統不會自動辨識筆跡；進度儲存在此裝置的瀏覽器中。建議用 Safari 開啟並使用 Apple Pencil。</div></div><script>

};let mode='國字注音',idx=0,wrongOnly=false;let records={};try{records=JSON.parse(localStorage.getItem('g7l6records_v3')||'{}')}catch(e){}let strokes=[],current=null,ctx,pad;function key(){return mode+'-'+idx}function list(){return wrongOnly?Object.keys(sets).flatMap(m=>sets[m].map((x,i)=>({m,i}))).filter(x=>records[x.m+'-'+x.i]===false):sets[mode].map((x,i)=>({m:mode,i}))}function persist(){localStorage.setItem('g7l6records_v3',JSON.stringify(records))}function render(){let t=document.getElementById('tabs');t.innerHTML='';[...Object.keys(sets),'錯題重練'].forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=(wrongOnly?n==='錯題重練':mode===n)?'active':'';b.onclick=()=>{wrongOnly=n==='錯題重練';if(!wrongOnly)mode=n;idx=0;render()};t.appendChild(b)});let a=list();if(idx>=a.length)idx=Math.max(0,a.length-1);let item=a[idx];document.getElementById('category').textContent=wrongOnly?'錯題重練':mode;document.getElementById('count').textContent=a.length?`${idx+1} / ${a.length}`:'0 / 0';document.getElementById('bar').style.width=(a.length?(idx+1)/a.length*100:0)+'%';document.getElementById('question').textContent=item?sets[item.m][item.i][0]:'目前沒有錯題，做得很好！';document.getElementById('hint').textContent=item?'請在下方直接手寫答案':'可切換其他題型繼續練習';document.getElementById('answer').hidden=true;document.getElementById('score').hidden=true;clearPad();let total=Object.keys(records).length,good=Object.values(records).filter(Boolean).length;document.getElementById('stats').textContent=`已作答 ${total} 題｜答對 ${good} 題｜待複習 ${total-good} 題`;}
